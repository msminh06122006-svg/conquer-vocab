<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conquer Vocab">

<meta name="theme-color" content="#15172A" media="(prefers-color-scheme: dark)">
<meta name="description" content="American English vocabulary with spaced review, pronunciation and spelling practice. Meanings in Vietnamese.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>Conquer Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFE;--sheet:#FFFFFF;--grid:rgba(91,110,170,.07);--grid2:rgba(91,110,170,.14);
  --margin:#EFA9A3;--ink:#1E2238;--soft:#5E6480;--faint:#979DB5;--line:#DDE2EE;
  --tim:#5B3CC4;--tim2:#43299E;--timbg:#EFEAFD;
  --ok:#1F7F55;--okbg:#E2F3EA;--bad:#C93F34;--badbg:#FBE9E7;
  --l1:#E4574B;--l2:#EE8A3A;--l3:#D9A91A;--l4:#2F9A76;--l5:#5B3CC4;
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --book:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15172A;--sheet:#1D2036;--grid:rgba(160,170,230,.05);--grid2:rgba(160,170,230,.09);
  --margin:#8E4A55;--ink:#ECEDF6;--soft:#AEB2CC;--faint:#7C8099;--line:#2F3350;
  --tim:#9D86F2;--tim2:#6F57C9;--timbg:#2A2550;--ok:#5CCB98;--okbg:#17362B;--bad:#F07B70;--badbg:#3D1F22;
}}
:root[data-theme="dark"]{
  --paper:#15172A;--sheet:#1D2036;--grid:rgba(160,170,230,.05);--grid2:rgba(160,170,230,.09);
  --margin:#8E4A55;--ink:#ECEDF6;--soft:#AEB2CC;--faint:#7C8099;--line:#2F3350;
  --tim:#9D86F2;--tim2:#6F57C9;--timbg:#2A2550;--ok:#5CCB98;--okbg:#17362B;--bad:#F07B70;--badbg:#3D1F22;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,8px 8px,8px 8px;-webkit-tap-highlight-color:transparent;min-height:100vh;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tim);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding:12px 16px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:10px 2px 14px}
.brand{font-family:var(--book);font-weight:600;font-size:28px;color:var(--tim);letter-spacing:-.01em}
.streak{font-size:14px;color:var(--soft);font-weight:500}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;position:relative;padding:18px 18px 18px 34px;margin-bottom:16px}
.sheet::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:1.5px;background:var(--margin)}
h2{font-size:17px;font-weight:600;margin:4px 0 10px}
.lead{font-size:18px;margin:0 0 14px;line-height:1.45}
.lead b{color:var(--tim)}
.hint{color:var(--soft);font-size:14px;margin:6px 0 0}
.btn{border:0;border-radius:14px;padding:13px 18px;min-height:50px;font-weight:600;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--tim);color:#fff;box-shadow:0 3px 0 var(--tim2)}
.btn-primary:active{box-shadow:0 1px 0 var(--tim2)}
.btn-ghost{background:var(--sheet);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn-ghost:active{box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5}
.wide{width:100%}
.levels{display:flex;gap:10px;align-items:flex-end;height:132px;padding-top:6px}
.lv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.lv .n{font-weight:600;font-size:14px}
.lv .bar{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;min-height:6px;transition:height .4s}
.lv .t{font-size:12px;color:var(--soft)}
.b1{background:var(--l1)}.b2{background:var(--l2)}.b3{background:var(--l3)}.b4{background:var(--l4)}.b5{background:var(--l5)}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-size:13px;margin-top:10px}
.topic{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .ic{font-size:26px;width:34px;text-align:center}
.topic .tx{flex:1;min-width:0}
.topic .nm{font-weight:600}
.topic .pg{font-size:13px;color:var(--soft)}
.track{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--tim);border-radius:3px}
.topic .btn{min-height:40px;padding:8px 14px;font-size:14px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft)}
.tip button{background:none;border:0;color:var(--tim);font-weight:600;padding:4px 0;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--faint)}
nav.tabs button[aria-current="page"]{color:var(--tim)}
nav.tabs svg{width:24px;height:24px}
.say{width:44px;height:44px;border-radius:50%;border:0;background:var(--timbg);color:var(--tim);display:inline-grid;place-items:center;flex:none}
.say svg{width:22px;height:22px}
.say.sm{width:36px;height:36px}.say.sm svg{width:18px;height:18px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tim);border-color:var(--tim);color:#fff}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .rw{flex:1;min-width:0}
.row .w{font-family:var(--book);font-weight:600;font-size:19px}
.ipa{color:var(--soft);font-size:14px}
.row .vi{font-size:14px}
.row .ex{font-family:var(--book);font-style:italic;color:var(--soft);font-size:15px;margin-top:4px}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;color:#fff;flex:none;margin-top:4px}
.badge.b0{background:var(--line);color:var(--soft)}
.badge.bk{background:var(--okbg);color:var(--ok)}
label.f{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
.f+input,.inp{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:16px}
details summary{cursor:pointer;font-weight:600;color:var(--tim);list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .d{font-size:13px;color:var(--soft)}
select.inp{width:auto;max-width:60%}
input[type=range]{accent-color:var(--tim);width:140px}
.empty{color:var(--soft);text-align:center;padding:20px 0}
textarea.inp{display:block;box-sizing:border-box;min-height:76px;resize:vertical;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;line-height:1.35;word-break:break-all;color:var(--ink)}
#codeOut{font-size:13px;color:var(--soft);margin-top:8px}
#codebox{margin-top:10px}
/* session */
.session{position:fixed;inset:0;z-index:20;background:inherit;background-color:var(--paper);background-image:inherit;background-size:inherit;overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.session .in{max-width:520px;margin:0 auto;padding:12px 16px 200px;min-height:100%}
.sbar{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--soft);display:grid;place-items:center}
.x svg{width:24px;height:24px}
.prog{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--tim);border-radius:6px;transition:width .3s}
.card{text-align:center;padding:26px 18px 22px 34px}
.emo{font-size:64px;line-height:1.1;margin-bottom:6px}
.word{font-family:var(--book);font-weight:600;font-size:40px;line-height:1.1;color:var(--tim);margin:4px 0;word-break:break-word}
.word.md{font-size:32px}
.type{display:inline-block;font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.sayrow{display:flex;justify-content:center;gap:10px;margin:14px 0}
.mean{font-size:20px;font-weight:600;margin:10px 0 4px}
.exbox{font-family:var(--book);font-style:italic;font-size:18px;line-height:1.55;color:var(--ink);display:flex;gap:10px;align-items:flex-start;text-align:left;border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.exbox .say{margin-top:2px}
.row .ex mark,.fx mark{background:var(--timbg);color:var(--tim);font-style:normal;font-weight:600;border-radius:4px;padding:0 3px}
.armed{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;box-shadow:none!important}
.exbox mark{background:var(--timbg);color:var(--tim);font-style:normal;font-weight:600;border-radius:4px;padding:0 3px}
.q{font-size:14px;color:var(--soft);margin:0 0 10px;text-align:center}
.bigsay{width:96px;height:96px;margin:10px auto}
.bigsay svg{width:44px;height:44px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--sheet);box-shadow:0 3px 0 var(--line);font-size:16px;font-weight:500}
.opt.en{font-family:var(--book);font-size:19px;font-weight:600}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.blank{font-family:var(--book);font-style:italic;font-size:21px;line-height:1.55;text-align:left}
.blank u{text-decoration:none;display:inline-block;min-width:80px;border-bottom:2px solid var(--tim);font-style:normal}
.typein{width:100%;font-family:var(--book);font-size:24px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--sheet);text-align:center}
.typein:focus{border-color:var(--tim);outline:none}
.hintw{letter-spacing:.3em;color:var(--faint);font-family:var(--book);font-size:20px;text-align:center;margin:8px 0}
.mic{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink)}
.mic svg{width:18px;height:18px;color:var(--tim)}
.mic.on{border-color:var(--bad);color:var(--bad)}
#micout{font-size:14px;margin-top:8px;min-height:21px}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .22s ease-out;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fb.show{transform:none}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb .in2{max-width:520px;margin:0 auto}
.fb .vt{font-weight:700;font-size:18px;margin-bottom:6px}
.fb.ok .vt{color:var(--ok)}.fb.bad .vt{color:var(--bad)}
.fb .fw{display:flex;align-items:center;gap:10px}
.fb .fw .w{font-family:var(--book);font-weight:600;font-size:22px}
.fb .fx{font-family:var(--book);font-style:italic;color:var(--soft);margin:6px 0 12px;font-size:16px}
.fb.ok .btn{background:var(--ok);box-shadow:0 3px 0 #145A3C;color:#fff}
.fb.bad .btn{background:var(--bad);box-shadow:0 3px 0 #8E2A22;color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%);z-index:25}
.foot .in2{max-width:520px;margin:0 auto;display:flex;gap:10px}
.foot .btn{flex:1}
.done h1{font-family:var(--book);font-weight:600;font-size:32px;color:var(--tim);margin:6px 0 8px}
.timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--tim);min-width:52px;text-align:right;font-size:17px}
.timer.okt{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.linkbtn{background:none;border:0;padding:0;margin:0;color:var(--tim);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.hint a{color:var(--tim);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:6px;background:var(--okbg);color:var(--ok);vertical-align:1px}
.pill.off{background:var(--line);color:var(--soft)}
.fillnote{font-size:13px;color:var(--soft);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-act="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/></svg>Learn</button>
  <button data-act="go" data-v="bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Words</button>
  <button data-act="go" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
</div></nav>
<div id="sess"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let view='home',bankQ='',bankF='all',sess=null;
let draft={w:'',vi:'',ipa:'',ex:'',type:''},addOpen=false;
/* ============ WORD LIST (American English) ============

const TOPICS_RAW = [
{id:'nha',name:'Home & Tools',icon:'🧰',list:`

`},
{id:'rau',name:'Fruits, Veggies & Herbs',icon:'🥬',list:`
scallion|ˈskæljən|noun|hành lá|Sprinkle a chopped scallion over the soup.|
cilantro|sɪˈlɑntroʊ|noun|rau mùi, ngò|Some people think cilantro tastes like soap.|🌿

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function norm(s){return(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim()}
function tight(s){return norm(s).replace(/[\s-]/g,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){a=tight(a);b=tight(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}
function startMic(id,btn){
  const out=document.getElementById('micout');
  if(!SR){out.textContent='This browser can’t listen to your voice. Try the latest Chrome or Safari.';return}
  if(rec){try{rec.abort()}catch(e){}rec=null;btn.classList.remove('on');return}
  const w=WORDS[id];let done=false;
  rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
  btn.classList.add('on');btn.lastChild.textContent=' Listening…';out.textContent='';
  const fin=(msg,color)=>{if(done)return;done=true;rec=null;btn.classList.remove('on');btn.lastChild.textContent=' Say it';out.innerHTML=msg;out.style.color=color||''};
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    let best=0,heard=alts[0]||'';
    alts.forEach(a=>{const s=Math.max(sim(a,w.w),norm(a).includes(norm(w.w))?1:0);if(s>best){best=s;heard=a}});
    if(best>=0.85)fin('✓ Great! I heard: <b>'+esc(heard)+'</b>','var(--ok)');
    else if(best>=0.6)fin('Close. I heard: <b>'+esc(heard)+'</b>. Listen to the model and try again.','var(--l2)');
    else fin('Not a match. I heard: <b>'+esc(heard)+'</b>','var(--bad)');
  };
  rec.onerror=e=>{const m={'not-allowed':'I can’t use your microphone. Allow mic access in your browser, then try again.','service-not-allowed':'I can’t use your microphone. Allow mic access in your browser, then try again.','no-speech':'I didn’t hear anything. Tap again and speak a bit louder.','network':'Checking pronunciation needs an internet connection.'};fin(m[e.error]||'I couldn’t hear you. Please try again.')};
  rec.onend=()=>fin('I didn’t hear anything. Tap again and speak a bit louder.');
  try{rec.start()}catch(e){fin('I can’t open the microphone here. Try opening the app in your browser.')}
}

let exportCode='',codeRun=0;
function b64enc(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64dec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pipeBytes(bytes,stream){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer())}
function exportJSON(){return JSON.stringify({app:'conquer-vocab',v:1,words:S.words,custom:S.custom,settings:S.settings,streak:S.streak})}
function plainCode(){return 'CV1.'+b64enc(new TextEncoder().encode(exportJSON()))}
async function makeCode(){
  const raw=new TextEncoder().encode(exportJSON());
  if(typeof CompressionStream==='function'){try{return 'CV1z.'+b64enc(await pipeBytes(raw,new CompressionStream('gzip')))}catch(e){}}
  return 'CV1.'+b64enc(raw);
}
function refreshCode(){const n=++codeRun;makeCode().then(c=>{if(n!==codeRun)return;exportCode=c;const ta=document.getElementById('codeOut');if(ta)ta.value=c}).catch(()=>{})}
async function readCode(text){
  const m=(text||'').replace(/\s+/g,'').match(/CV1(z?)\.([A-Za-z0-9_-]+)/);
  if(!m)throw new Error('bad');
  let bytes=b64dec(m[2]);
  if(m[1]){if(typeof DecompressionStream!=='function')throw new Error('old');bytes=await pipeBytes(bytes,new DecompressionStream('gzip'))}
  const data=JSON.parse(new TextDecoder().decode(bytes));
  if(!data||data.app!=='conquer-vocab'||!data.words||typeof data.words!=='object')throw new Error('bad');
  return data;
}
function mergeProgress(data){
  const inc=normalizeState({words:data.words,custom:data.custom,settings:data.settings,streak:data.streak});
  const rank=p=>p.known?6:(+p.lv||1);
  let n=0;
  for(const id in inc.words){
    const a=S.words[id],b=inc.words[id];
    if(!b||typeof b!=='object')continue;
    if(!a||rank(b)>rank(a)||(rank(b)===rank(a)&&(+b.due||0)>(+a.due||0))){S.words[id]=b;n++}
  }
  const have=new Set(S.custom.map(c=>c.id));
  inc.custom.forEach(c=>{if(c&&c.id&&c.w&&!have.has(c.id)){S.custom.push(c);have.add(c.id)}});
  if((+inc.streak.count||0)>(+S.streak.count||0))S.streak=inc.streak;
  const tipDone=S.settings.tipDone||inc.settings.tipDone;
  S.settings=Object.assign({},S.settings,inc.settings,{tipDone});
  rebuildCustom();save();
  return n;
}

function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return''}}

const FILL_SCHEMA={type:'OBJECT',properties:{ipa:{type:'STRING'},type:{type:'STRING'},vi:{type:'STRING'},ex:{type:'STRING'}},required:['ipa','type','vi','ex']};
function fillPrompt(w,ctx){
  const W=JSON.stringify(w);
  return 'You help a Vietnamese learner of American English (B2 level, aiming for native-like fluency; reads novels and wants to write).\n'+
    'Word or phrase: '+W+'\n'+
    (ctx?'The learner found it in this sentence: '+JSON.stringify(ctx)+'\nUse that sentence to choose the right sense.\n':'')+

    '"ex": '+(ctx?'an empty string.':'one natural American English example sentence (under 16 words) that contains the exact text '+W+'.');

function parseLoose(t){
  if(!t)return null;t=String(t).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)return null;
  try{const o=JSON.parse(t.slice(a,b+1));return o&&typeof o==='object'?o:null}catch(e){return null}
}
async function fetchT(url,opt,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||15000);try{return await fetch(url,Object.assign({},opt||{},{signal:c.signal}))}finally{clearTimeout(t)}}
async function claudeFill(w,ctx){return await SAMPLE.json(fillPrompt(w,ctx)+'\nReturn ONLY the JSON object, no other text.',{modelTier:'quick'})}
async function geminiFill(w,ctx,key){
  const saved=lsGet(KEY_AIMODEL);
  const models=saved?[saved,...GEMINI_MODELS.filter(m=>m!==saved)]:GEMINI_MODELS;
  const prompt=fillPrompt(w,ctx);
  const bodies=[
    JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',responseSchema:FILL_SCHEMA}}),
    JSON.stringify({contents:[{role:'user',parts:[{text:prompt+'\nReply with the JSON object only.'}]}]})
  ];
  let last={kind:'other'};
  for(const m of models){
    for(const body of bodies){
      let res;
      try{res=await fetchT('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body},25000)}
      catch(e){throw{kind:'network'}}
      let data=null;try{data=await res.json()}catch(e){}
      if(res.ok){
        const c=((data&&data.candidates)||[])[0];
        const txt=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
        const r=parseLoose(txt);
        if(r){lsSet(KEY_AIMODEL,m);return r}
        last={kind:'other'};continue;
      }
      const er=(data&&data.error)||{},msg=String(er.message||''),why=JSON.stringify(er.details||'');
      if(/API_KEY|API key/.test(why+' '+msg))throw{kind:'badkey',msg};
      if(res.status===429||er.status==='RESOURCE_EXHAUSTED'){last={kind:'quota',msg};break}
      last={kind:'other',msg};
      if(res.status!==400)break; // a 400 may be the JSON schema: retry this model without it
    }
  }
  if(saved&&last.kind!=='quota')lsDel(KEY_AIMODEL);
  throw last;
}

const ARPA={AA:'ɑ',AE:'æ',AH:'ʌ',AO:'ɔ',AW:'aʊ',AY:'aɪ',B:'b',CH:'tʃ',D:'d',DH:'ð',EH:'ɛ',ER:'ɝ',EY:'eɪ',F:'f',G:'ɡ',HH:'h',IH:'ɪ',IY:'i',JH:'dʒ',K:'k',L:'l',M:'m',N:'n',NG:'ŋ',OW:'oʊ',OY:'ɔɪ',P:'p',R:'r',S:'s',SH:'ʃ',T:'t',TH:'θ',UH:'ʊ',UW:'u',V:'v',W:'w',Y:'j',Z:'z',ZH:'ʒ'};
const ONSETS=new Set('pl pr bl br tr dr kl kr ɡl ɡr fl fr θr ʃr sp st sk sm sn sl sw spl spr str skr skw tw dw kw ɡw θw pj bj kj mj fj vj hj nj lj'.split(' '));
function arpaToIpa(pron){
  const ph=String(pron||'').trim().split(/\s+/).map(t=>{const m=t.match(/^([A-Z]+)([012])?$/);if(!m||!ARPA[m[1]])return null;
    const st=m[2],sym=st==='0'&&m[1]==='AH'?'ə':st==='0'&&m[1]==='ER'?'ɚ':ARPA[m[1]];return{s:sym,v:st!==undefined,st}}).filter(Boolean);
  if(!ph.length)return'';
  const many=ph.filter(p=>p.v).length>1,out=[];
  for(const p of ph){
    if(p.v&&many&&(p.st==='1'||p.st==='2')){
      let j=out.length;const cons=[];
      while(j>0&&!out[j-1].v&&!out[j-1].mark){j--;cons.unshift(out[j].s)}
      let k=0;if(j>0)while(k<cons.length-1&&!ONSETS.has(cons.slice(k).join('')))k++;
      out.splice(j>0?j+k:0,0,{s:p.st==='1'?'ˈ':'ˌ',mark:true});
    }
    out.push(p);
  }
  return out.map(o=>o.s).join('');
}
function plainText(h){try{return new DOMParser().parseFromString(String(h),'text/html').documentElement.textContent.replace(/\s+/g,' ').trim()}catch(e){return String(h).replace(/<[^>]+>/g,'').trim()}}
async function translateVi(q){
  try{const r=await fetchT('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|vi',{},12000);if(!r.ok)return'';
    const j=await r.json();let t=plainText((j&&j.responseData&&j.responseData.translatedText)||'');
    if(!t||/MYMEMORY|QUERY LENGTH|INVALID/i.test(t)||t.toLowerCase()===q.toLowerCase())return'';return t}catch(e){return''}
}
async function dictFill(w){
  const q=w.trim(),lo=q.toLowerCase(),out={ipa:'',type:'',vi:'',ex:''};
  const [dm,wk]=await Promise.allSettled([
    fetchT('https://api.datamuse.com/words?sp='+encodeURIComponent(lo)+'&md=dpr&max=1',{},12000).then(r=>r.ok?r.json():[]),
    fetchT('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(lo.replace(/ /g,'_')),{},12000).then(r=>r.ok?r.json():null)
  ]);
  const hit=dm.status==='fulfilled'&&Array.isArray(dm.value)?dm.value.find(x=>x&&String(x.word).toLowerCase()===lo):null;
  let def='';
  if(hit){
    const pron=(hit.tags||[]).find(t=>t.startsWith('pron:'));if(pron)out.ipa=arpaToIpa(pron.slice(5));
    const pos={n:'noun',v:'verb',adj:'adjective',adv:'adverb'};const tag=(hit.tags||[]).find(t=>pos[t]);if(tag)out.type=pos[tag];
    const d=(hit.defs||[])[0];
    if(d){const [p,txt]=d.split('\t');if(!out.type&&pos[p])out.type=pos[p];
      def=String(txt||'').replace(/\[[^\]]*\]/g,'').replace(/^(\([^)]*\)\s*)+/,'').replace(/\s+/g,' ').trim().replace(/\.$/,'')}
  }
  if(wk.status==='fulfilled'&&wk.value&&Array.isArray(wk.value.en)){
    outer:for(const e of wk.value.en)for(const d of (e.definitions||[]))for(const x of [...(d.parsedExamples||[]).map(p=>p.example),...(d.examples||[])]){
      const t=plainText(x);if(t&&t.length<=160&&t.toLowerCase().includes(lo)){out.ex=t;break outer}
    }
  }
  const src=def?def.replace(/^to /i,''):q;
  let vi=await translateVi(src);
  if(vi){vi=vi.replace(/[.。]$/,'');vi=vi.charAt(0).toLowerCase()+vi.slice(1);if(def&&def.length<=60)vi+=' ('+def.charAt(0).toLowerCase()+def.slice(1)+')'}
  else if(def)vi=def;
  out.vi=vi;
  return out;
}

/* ============ LESSONS AND REVIEWS ============ */
function startLearn(tid){
  const t=TOPICS.find(x=>x.id===tid);const pool=t.ids.filter(isNew);
  if(!pool.length){toast('You’ve learned every word in this topic!');return}
  const first=pool.splice(0,S.settings.per);
  sess={kind:'learn',steps:first.map(id=>({t:'card',id})),pool,i:0,learned:[],missed:{},quiz:false,right:0,wrong:0,wrongIds:[],answered:false};
  openSess();
}
function startReview(){
  const ids=dueList().slice(0,20);if(!ids.length){toast('Nothing to review yet.');return}
  sess={kind:'review',steps:shuffle(ids).map(id=>({t:'q',id,qt:pickQt(id,false)})),i:0,right:0,wrong:0,wrongIds:[],ups:0,answered:false};
  openSess();
}
function startFocus(){
  const ms=S.settings.focusMin*MIN;
  sess={kind:'focus',steps:[],i:0,learned:[],batch:[],newCount:0,right:0,wrong:0,wrongIds:[],ups:0,answered:false,total:ms,left:ms,last:performance.now(),timeUp:false};
  openSess();
}
function refillFocus(){
  const s=sess,now=Date.now();
  if(s.batch.length){
    s.batch.forEach(id=>{S.words[id]={lv:1,due:now+H,added:now}});save();
    s.steps.push(...learnQuiz(s.batch,{learnQ:true}));
    s.newCount+=s.batch.length;s.batch=[];return;
  }
  const due=dueList().slice(0,5);
  if(due.length){shuffle(due).forEach(id=>s.steps.push({t:'q',id,qt:pickQt(id,false)}));return}
  const ts=TOPICS.filter(t=>t.ids.some(isNew));
  if(ts.length){const t=ts[Math.floor(Math.random()*ts.length)];t.ids.filter(isNew).slice(0,5).forEach(id=>s.steps.push({t:'card',id}));return}
  let ids=Object.keys(S.words).filter(id=>WORDS[id]&&!S.words[id].known);
  if(!ids.length)ids=Object.keys(WORDS);
  shuffle(ids).slice(0,5).forEach(id=>s.steps.push({t:'q',id,qt:pickQt(id,false),practice:true}));
}
function fmtClock(ms){const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
setInterval(()=>{
  if(!sess||sess.kind!=='focus')return;
  const now=performance.now();
  if(!document.hidden&&!sess.timeUp){sess.left-=now-sess.last}
  sess.last=now;
  const el=document.getElementById('timer'),pb=document.getElementById('pbar');
  if(pb)pb.style.width=Math.min(100,Math.round((1-sess.left/sess.total)*100))+'%';
  if(sess.timeUp)return;
  if(sess.left<=0){sess.timeUp=true;if(el){el.textContent='Done ✓';el.classList.add('okt')}toast('Time’s up! Finish this question and you’re done.')}
  else if(el)el.textContent=fmtClock(sess.left);
},250);
function finishFocus(){
  const s=sess,now=Date.now();
  if(s.batch.length){s.batch.forEach(id=>{S.words[id]={lv:1,due:now+H,added:now}});s.newCount+=s.batch.length;s.batch=[]}
  bumpStreak();save();
  const total=s.right+s.wrong;
  $('#sess').innerHTML=`<div class="session"><div class="in done"><div class="sbar"><div class="prog"><i style="width:100%"></i></div></div>
    <div class="sheet"><h1>${S.settings.focusMin} minutes done! 🎉</h1>${total?`<p class="lead">You got <b>${s.right}/${total}</b> right${s.newCount?` and learned <b>${plural(s.newCount,'new word')}</b>`:''}.</p>`:''}<p class="hint">Nice work. You’re free to go.</p></div></div></div>
    <div class="foot"><div class="in2"><button class="btn btn-primary" data-act="quit">Done</button></div></div>`;
  sess={kind:'done'};
}
function pickQt(id,learning){
  const w=WORDS[id],lv=learning?1:(prog(id)?.lv||1);
  const canType=w.w.length<=32;
  const canBlank=hasBlank(w);
  const r=(a)=>a[Math.floor(Math.random()*a.length)];
  if(!canType)return r(canBlank?['blank','listen','word']:['listen','word','mean']);
  if(learning)return r(['type','type','dictation']);
  if(lv<=2)return r(['type','dictation','type','listen'].concat(canBlank?['blank']:[]));
  return r(['type','dictation','type','dictation'].concat(canBlank?['blank']:[]));
}
function pickChoice(id){const w=WORDS[id];return pick(hasBlank(w)?['word','listen','blank']:['word','listen'])}
function learnQuiz(ids,extra){
  const out=[];shuffle(ids).forEach(id=>out.push(Object.assign({t:'q',id,qt:pickChoice(id)},extra)));
  shuffle(ids).forEach(id=>out.push(Object.assign({t:'q',id,qt:WORDS[id].w.length<=32?pick(['type','type','dictation']):pickChoice(id)},extra)));
  return out;
}
function distract(id,field,n){
  const w=WORDS[id];const seen=new Set([w[field].toLowerCase()]);
  const same=shuffle(TOPICS.find(t=>t.id===w.topic).ids.filter(x=>x!==id));
  const all=shuffle(Object.keys(WORDS).filter(x=>x!==id));
  const out=[];
  for(const x of same.concat(all)){const v=WORDS[x][field].toLowerCase();if(seen.has(v))continue;seen.add(v);out.push(x);if(out.length>=n)break}
  return out;
}
function openSess(){document.body.style.overflow='hidden';renderSess()}
function closeSess(){if(rec){try{rec.abort()}catch(e){}rec=null}sess=null;$('#sess').innerHTML='';document.body.style.overflow='';render()}
function progressPct(){
  if(sess.kind==='focus')return Math.min(100,Math.round((1-sess.left/sess.total)*100));
  if(sess.kind==='learn'){const tot=sess.quiz?sess.steps.length:sess.steps.length+sess.learned.length+(sess.steps.length-sess.i);return Math.min(100,Math.round(sess.i/Math.max(1,tot)*100))}
  return Math.round(sess.i/sess.steps.length*100);
}

    if(sess.kind==='learn'&&!sess.quiz&&sess.learned.length){sess.quiz=true;sess.steps.push(...learnQuiz(sess.learned,{}))}
    else return finish();
  }
  const st=sess.steps[sess.i];const w=WORDS[st.id];
  let body='',foot='';
  if(st.t==='card'){
    body=`<div class="sheet card">${w.emo?`<div class="emo" aria-hidden="true">${w.emo}</div>`:''}
      <div class="word ${w.w.length>14?'md':''}">${esc(w.w)}</div>
      <div>${w.ipa?`<span class="ipa">/${esc(w.ipa)}/</span>`:''}${w.type?`<span class="type">${esc(w.type)}</span>`:''}</div>
      <div class="sayrow"><button class="say" data-act="say" data-id="${w.id}" aria-label="Play">${IC.spk}</button><button class="say" data-act="say" data-id="${w.id}" data-slow="1" aria-label="Play slowly">${IC.slow}</button></div>
      <div class="mean" lang="vi">${esc(w.vi)}</div>
      ${w.ex?`<div class="exbox"><button class="say sm" data-act="sayex" data-id="${w.id}" aria-label="Play the example sentence">${IC.spk}</button><span>${hiEx(w)}</span></div>`:''}
      <div style="margin-top:16px"><button class="mic" data-act="mic" data-id="${w.id}">${IC.mic}<span> Say it</span></button><div id="micout"></div></div>
    </div>`;
    foot=`<button class="btn btn-ghost" data-act="known">I know this</button><button class="btn btn-primary" data-act="learnit">Learn it</button>`;
  }else{
    if(!st.opts){
      if(st.qt==='mean')st.opts=shuffle([st.id,...distract(st.id,'vi',3)]);
      else if(['listen','word','blank'].includes(st.qt))st.opts=shuffle([st.id,...distract(st.id,'w',3)]);
    }
    const opts=(field,cls)=>`<div class="opts">${st.opts.map(id=>`<button class="opt ${cls}"${field==='vi'?' lang="vi"':''} data-act="pick" data-id="${id}">${esc(WORDS[id][field])}</button>`).join('')}</div>`;
    const plv=st.learnQ||sess.kind==='learn'?1:(prog(st.id)?.lv||1);const hintw=w.w.split('').map((ch,i)=>ch===' '?'\u00a0\u00a0':/[-']/.test(ch)?ch:((i===0||w.w[i-1]===' ')&&plv<3)?ch:'_').join('');
    if(st.qt==='mean')body=`<p class="q">What does this mean?</p><div class="sheet card"><div class="word ${w.w.length>14?'md':''}">${esc(w.w)}</div>${w.ipa?`<div class="ipa">/${esc(w.ipa)}/</div>`:''}<div class="sayrow"><button class="say" data-act="say" data-id="${w.id}" aria-label="Play">${IC.spk}</button></div></div>${opts('vi','')}`;
    else if(st.qt==='listen')body=`<p class="q">Listen and pick the word</p><div class="sheet card"><button class="say bigsay" data-act="say" data-id="${w.id}" aria-label="Play again">${IC.spk}</button><button class="chip" data-act="say" data-id="${w.id}" data-slow="1">Play slowly</button></div>${opts('w','en')}`;
    else if(st.qt==='word')body=`<p class="q">What’s this in English?</p><div class="sheet card">${w.emo?`<div class="emo" aria-hidden="true">${w.emo}</div>`:''}<div class="mean" lang="vi">${esc(w.vi)}</div></div>${opts('w','en')}`;
    else if(st.qt==='blank'){const m=w.ex.match(reRx(w.w));const i=m.index+m[1].length;body=`<p class="q">Fill in the blank</p><div class="sheet card"><div class="blank">${esc(w.ex.slice(0,i))}<u>&nbsp;</u>${esc(w.ex.slice(i+m[2].length))}</div><p class="hint" style="text-align:left" lang="vi">${esc(w.vi)}</p></div>${opts('w','en')}`}
    else if(st.qt==='type')body=`<p class="q">Type the English word</p><div class="sheet card">${w.emo?`<div class="emo" aria-hidden="true">${w.emo}</div>`:''}<div class="mean" lang="vi">${esc(w.vi)}</div><div class="hintw">${esc(hintw)}</div></div><input class="typein" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer">`;
    else if(st.qt==='dictation')body=`<p class="q">Type what you hear</p><div class="sheet card"><button class="say bigsay" data-act="say" data-id="${w.id}" aria-label="Play again">${IC.spk}</button><button class="chip" data-act="say" data-id="${w.id}" data-slow="1">Play slowly</button></div><input class="typein" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer">`;
    if(st.qt==='type'||st.qt==='dictation')foot=`<button class="btn btn-ghost" data-act="giveup">I don’t know</button><button class="btn btn-primary" data-act="check">Check</button>`;
  }
  $('#sess').innerHTML=`<div class="session"><div class="in"><div class="sbar">${sess.kind==='focus'?'':`<button class="x" data-act="quit" aria-label="Exit">${IC.x}</button>`}<div class="prog"><i id="pbar" style="width:${progressPct()}%"></i></div>${sess.kind==='focus'?`<span class="timer ${sess.timeUp?'okt':''}" id="timer">${sess.timeUp?'Done ✓':fmtClock(sess.left)}</span>`:''}</div>${body}</div></div>${foot?`<div class="foot"><div class="in2">${foot}</div></div>`:''}<div class="fb" id="fb"></div>`;
  sess.answered=false;
  const autoSay=st.t==='card'||st.qt==='mean'||st.qt==='listen'||st.qt==='dictation';
  if(autoSay&&(S.settings.auto||st.qt==='listen'||st.qt==='dictation'))speak(w.w);
  const a=$('#ans');if(a){a.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkTyped()}});setTimeout(()=>a.focus(),250)}
}
function answer(ok,note){
  if(sess.answered)return;sess.answered=true;
  const st=sess.steps[sess.i];const w=WORDS[st.id];
  if(ok)sess.right++;else{sess.wrong++;if(!sess.wrongIds.includes(st.id))sess.wrongIds.push(st.id)}
  if(sess.kind==='focus'&&st.learnQ){if(!ok){S.words[st.id].due=Date.now()+10*MIN;save()}}
  else if(sess.kind==='review'||(sess.kind==='focus'&&!st.practice)){
    const p=S.words[st.id];
    if(ok){if(p.lv<5)sess.ups++;p.lv=Math.min(5,p.lv+1);p.due=Date.now()+IV[p.lv]}
    else{p.lv=Math.max(1,p.lv-1);p.due=Date.now()+10*MIN;p.wrong=(p.wrong||0)+1}
    save();
  }else if(!ok)sess.missed[st.id]=true;
  const fb=$('#fb');const f=$('.foot');if(f)f.remove();
  fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=`<div class="in2"><div class="vt">${ok?pick(['Correct!','Nice one!','Nailed it!','Spot on!']):'Not quite'}</div>${note?`<div style="margin-bottom:6px">${note}</div>`:''}
    <div class="fw"><button class="say sm" data-act="say" data-id="${w.id}" aria-label="Play">${IC.spk}</button><span class="w">${esc(w.w)}</span>${w.ipa?`<span class="ipa">/${esc(w.ipa)}/</span>`:''}</div>
    <div lang="vi">${esc(w.vi)}</div>${w.ex?`<div class="fx">${hiEx(w)}</div>`:'<div style="height:12px"></div>'}
    ${!ok&&(st.qt==='type'||st.qt==='dictation')?`<label class="f" for="retype">Type it correctly to lock in the spelling</label><input class="typein" id="retype" style="font-size:20px;padding:10px;margin-bottom:12px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">`:''}
    <button class="btn wide" data-act="next" ${!ok&&(st.qt==='type'||st.qt==='dictation')?'disabled':''}>Continue</button></div>`;
  requestAnimationFrame(()=>fb.classList.add('show'));
  speak(w.w);
  const rt=fb.querySelector('#retype');
  if(rt){rt.addEventListener('input',()=>{const okk=tight(rt.value)===tight(w.w);fb.querySelector('[data-act=next]').disabled=!okk;rt.style.borderColor=okk?'var(--ok)':''});
    rt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=fb.querySelector('[data-act=next]');if(!b.disabled)b.click()}});
    setTimeout(()=>rt.focus({preventScroll:true}),260)}
  else setTimeout(()=>{const b=fb.querySelector('[data-act=next]');if(b)b.focus({preventScroll:true})},260);
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function checkTyped(){
  if(!sess||sess.answered)return;const st=sess.steps[sess.i];const w=WORDS[st.id];
  const v=$('#ans').value;if(!v.trim()){toast('Type your answer first.');return}
  const a=tight(v),b=tight(w.w);
  if(a===b)return answer(true);
  const d=lev(a,b);
  answer(false,d<=1&&b.length>=5?'So close, just one letter off. You typed: <b>'+esc(v)+'</b>':'You typed: <b>'+esc(v)+'</b>');
}
function finish(){
  const s=sess;
  if(s.kind==='learn'){
    const now=Date.now();
    s.learned.forEach(id=>{S.words[id]={lv:1,due:now+(s.missed[id]?10*MIN:H),added:now}});
  }
  if(s.learned?.length||s.kind==='review'){bumpStreak()}
  save();
  const total=s.right+s.wrong;
  const head=s.kind==='learn'?(s.learned.length?`You learned ${plural(s.learned.length,'new word')}`:'You already knew these'):'Review complete';
  const sub=s.kind==='learn'?(s.learned.length?'Your first review is in about an hour.':'Try another topic.'):`${plural(s.ups,'word')} moved up a level. ${s.wrongIds.length?'The ones you missed will come back in 10 minutes.':''}`;
  const wr=s.wrongIds.map(id=>{const w=WORDS[id];return`<div class="row"><button class="say sm" data-act="say" data-id="${id}" aria-label="Play">${IC.spk}</button><div class="rw"><span class="w">${esc(w.w)}</span> ${w.ipa?`<span class="ipa">/${esc(w.ipa)}/</span>`:''}<div class="vi" lang="vi">${esc(w.vi)}</div></div></div>`}).join('');
  $('#sess').innerHTML=`<div class="session"><div class="in done"><div class="sbar"><button class="x" data-act="quit" aria-label="Close">${IC.x}</button><div class="prog"><i style="width:100%"></i></div></div>
    <div class="sheet"><h1>${head}</h1>${total?`<p class="lead">You got <b>${s.right}/${total}</b> right.</p>`:''}<p class="hint">${sub}</p></div>
    ${wr?`<div class="sheet"><h2>Keep an eye on these</h2>${wr}</div>`:''}</div></div>
    <div class="foot"><div class="in2"><button class="btn btn-primary" data-act="quit">Back to home</button></div></div>`;
  sess={kind:'done'};
}

/* ============ EVENTS ============ */
const ACT={
  go:d=>{view=d.v;render();window.scrollTo(0,0)},
  learn:d=>startLearn(d.t),
  review:()=>startReview(),
  focus:()=>startFocus(),
  tip:()=>{S.settings.tipDone=true;save();render()},
  say:d=>speak(WORDS[d.id].w,!!d.slow),
  sayex:d=>speak(WORDS[d.id].ex),
  mic:(d,b)=>startMic(d.id,b),
  known:()=>{const st=sess.steps[sess.i];S.words[st.id]={lv:5,due:0,known:true,added:Date.now()};save();
    if(sess.pool&&sess.pool.length){const nx=sess.pool.shift();sess.steps.push({t:'card',id:nx})}
    sess.i++;renderSess()},
  learnit:()=>{const lid=sess.steps[sess.i].id;sess.learned.push(lid);if(sess.kind==='focus')sess.batch.push(lid);sess.i++;renderSess()},
  pick:d=>{if(sess.answered)return;const st=sess.steps[sess.i];const ok=d.id===st.id;
    document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.id===st.id)b.classList.add('right');else if(b.dataset.id===d.id)b.classList.add('wrong');b.disabled=true});
    answer(ok)},
  check:()=>checkTyped(),
  giveup:()=>answer(false),
  next:(d,b)=>{if(b&&b.disabled)return;sess.i++;renderSess();const se=$('.session');if(se)se.scrollTop=0},
  quit:(d,b)=>{if(sess&&sess.kind==='learn'&&sess.learned.length&&!sess.quiz&&!armed(b)){toast('If you leave now, these words won’t be saved. Tap X again to leave.');return}closeSess()},
  filter:d=>{bankF=d.f;render()},
  del:(d,b)=>{if(!armed(b,'Tap again to delete'))return;S.custom=S.custom.filter(c=>c.id!==d.id);delete S.words[d.id];rebuildCustom();save();render()},
  add:()=>{
    const w=$('#nw-w').value.trim(),vi=$('#nw-vi').value.trim();
    if(!w||!vi){toast('Add both the English word and its Vietnamese meaning.');return}
    const id='mine/'+slug(w)+'-'+Date.now().toString(36);
    S.custom.push({id,w,vi,ipa:$('#nw-ipa').value.trim().replace(/^\/|\/$/g,''),type:(draft.type||'').trim(),ex:$('#nw-ex').value.trim(),emo:''});
    draft={w:'',vi:'',ipa:'',ex:'',type:''};addOpen=true;
    rebuildCustom();save();toast('Saved "'+w+'" to My Words.');render();
  },
  ai:async(d,b)=>{
    const w=($('#nw-w')?.value||'').trim();if(!w){toast('Type the English word first.');return}
    if(navigator.onLine===false){toast('You’re offline. Connect to the internet to auto-fill.');return}
    const ctx=($('#nw-ex')?.value||'').trim();
    draft.w=w;draft.ex=ctx;
    b.disabled=true;b.textContent='Filling in…';
    let r=null,src='',why='';
    if(SAMPLE){try{r=await claudeFill(w,ctx);src='ai'}catch(e){why='other'}}
    if(!r&&aiKey()){try{r=await geminiFill(w,ctx,aiKey());src='ai'}catch(e){why=(e&&e.kind)||'other'}}
    if(!r){try{r=await dictFill(w);src='dict'}catch(e){r=null}}
    const got=!!(r&&(r.vi||r.ipa||r.ex));
    if(got){
      if(r.vi)setField('vi',String(r.vi).trim());
      if(r.ipa)setField('ipa',String(r.ipa).replace(/^[\/\[]+|[\/\]]+$/g,'').trim());
      if(r.ex&&!ctx)setField('ex',String(r.ex).trim());
      draft.type=String(r.type||'').trim().toLowerCase().slice(0,24);
    }
    const lead={badkey:'Google rejected your AI key, so free dictionaries filled this in. Check the key in Settings.',quota:'Your free AI limit is used up for now, so free dictionaries filled this in.',network:'The AI couldn’t be reached, so free dictionaries filled this in.',other:'The AI didn’t answer, so free dictionaries filled this in.'}[why];
    toast(!got?'Couldn’t find that. Type the meaning yourself.':src==='ai'?'Filled in by AI. Check it, then tap Save word.':lead||'Filled in from free dictionaries. Check the meaning, then tap Save word.');
    if(b.isConnected){b.disabled=false;b.textContent=aiOn()?'Auto-fill with AI':'Auto-fill'}
  },
  savekey:async(d,b)=>{
    const k=($('#aikey')?.value||'').replace(/\s+/g,'');
    if(!k){toast('Paste your key first.');return}
    if(!/^[\w.-]{20,}$/.test(k)){toast('That doesn’t look like an API key. Copy it again from AI Studio.');return}
    b.disabled=true;b.textContent='Checking…';
    try{await geminiFill('hello','',k);lsSet(KEY_AI,k);toast('Key saved. Auto-fill now uses AI.')}
    catch(e){
      const kind=e&&e.kind;
      if(kind==='badkey'){toast('Google rejected this key. Copy it again from AI Studio.');if(b.isConnected){b.disabled=false;b.textContent='Save key'}return}
      lsSet(KEY_AI,k);
      toast(kind==='quota'?'Key saved. Its free limit is used up for now, so dictionaries fill in until it resets.':'Key saved, but the test didn’t go through. If Auto-fill doesn’t use AI, check the key in AI Studio.');
    }
    render();
  },
  delkey:(d,b)=>{if(!armed(b,'Tap again to remove'))return;lsDel(KEY_AI);lsDel(KEY_AIMODEL);toast('Key removed. Auto-fill uses free dictionaries.');render()},
  test:()=>speak('The quiet meadow was wet with morning dew.'),
  copycode:(d,b)=>{
    const code=exportCode||plainCode();
    const done=()=>{toast('Progress code copied. Paste it into the other app.');b.textContent='Copied ✓';setTimeout(()=>{if(b.isConnected)b.textContent='Copy progress code'},2500)};
    const manual=()=>{const box=$('#codebox'),ta=$('#codeOut');if(box)box.open=true;if(ta){ta.value=code;ta.focus();ta.select()}toast('Select the code under Show the code and copy it.')};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,manual);return}}catch(e){}
    manual();
  },
  loadcode:async(d,b)=>{
    const ta=$('#codeIn'),txt=ta?ta.value:'';
    if(!txt.trim()){toast('Paste a progress code first.');return}
    b.disabled=true;
    try{const n=mergeProgress(await readCode(txt));render();toast(n?'Progress loaded: '+plural(n,'word')+' updated.':'You already have everything in that code.')}
    catch(e){toast(e&&e.message==='old'?'This browser is too old to read that code. Update it, then try again.':'That code doesn’t look right. Copy it again from the other app.')}
    finally{if(b.isConnected)b.disabled=false}
  },
  reset:(d,b)=>{if(!armed(b,'Tap again to erase everything'))return;const keep=S.settings;S=blank();S.settings=keep;rebuildCustom();save();render();toast('All progress reset.')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('input',e=>{
  if(e.target.id==='bq'){bankQ=e.target.value;render()}
  const nid=e.target.id||'';if(nid.startsWith('nw-')){const k=nid.slice(3);if(k in draft){draft[k]=e.target.value;if(k==='w')draft.type=''}}
  if(e.target.id==='rate'){S.settings.rate=+e.target.value;$('#ratev').textContent=S.settings.rate.toFixed(2)+'×'}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rate'){save()}
  if(e.target.id==='voice'){S.settings.voice=e.target.value;save();speak('Hello, this is how I sound.')}
  if(e.target.id==='auto'){S.settings.auto=e.target.checked;save()}
  if(e.target.id==='per'){S.settings.per=+e.target.value;save()}
  if(e.target.id==='focusOn'){S.settings.focusOn=e.target.checked;save();toast(e.target.checked?'Next time you open the app, a session starts right away.':'Study before screen time is off.')}
  if(e.target.id==='focusMin'){S.settings.focusMin=+e.target.value;save()}
});
setInterval(()=>{if(!sess&&view==='home')render()},60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sess)render()});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='addbox')addOpen=e.target.open},true);
render();
if(S.settings.focusOn)startFocus();
</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
